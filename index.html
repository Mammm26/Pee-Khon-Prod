<style>
:root{--bg1:#e3f2fd;--bg2:#fff;--ink:#4a6b8a;--paper:#fff;--blue:#bfe0f8;--blue2:#a5d0f0;--pink:#ff8fab;--shadow:rgba(110,160,210,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1e3550;--bg2:#2a4668;--ink:#2f4d6b;--shadow:rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:linear-gradient(170deg,var(--bg1),var(--bg2));font-family:'Mali','Sarabun',sans-serif;color:var(--ink);overflow:hidden}
#stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .6s}
#stage.gone{opacity:0;pointer-events:none}
h1{font-size:1.15rem;margin:0;font-weight:600;text-align:center}
.hint{margin-top:6px;font-size:.9rem;opacity:.8;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.bunny{display:block}
.peek{margin-bottom:-18px;position:relative;z-index:5;animation:bob 2.4s ease-in-out infinite}
.env{width:min(300px,82vw);aspect-ratio:3/2;position:relative;perspective:900px;cursor:pointer;filter:drop-shadow(0 12px 18px var(--shadow))}
.back{position:absolute;inset:0;background:var(--blue2);border-radius:8px}
.letter{position:absolute;left:8%;right:8%;top:8%;height:80%;background:var(--paper);border-radius:6px;z-index:2;transition:transform .9s .55s ease;padding:14px 12px}
.letter i{display:block;height:5px;border-radius:3px;background:var(--blue);margin-bottom:9px}
.pocket{position:absolute;inset:0;z-index:4;background:var(--blue);border-radius:8px;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.rb{position:absolute;left:50%;top:54%;width:34%;transform:translate(-50%,-50%);z-index:6;pointer-events:none;animation:bobc 2.4s ease-in-out infinite}
@keyframes bobc{50%{transform:translate(-50%,-56%)}}
.pb{width:min(230px,70vw);height:auto;mix-blend-mode:multiply}
.pb2{-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
.env.open .rb{opacity:0;transition:opacity .4s}
.rb{transition:opacity .4s}
.flap{position:absolute;left:0;right:0;top:0;height:60%;background:#d4eafb;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;z-index:5;transition:transform .7s ease,z-index 0s .35s}
.env.open .flap{transform:rotateX(180deg);z-index:1;background:var(--blue2)}
.env.open .letter{transform:translateY(-62%)}
.env.open .peek2{display:none}
#reader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transform:scale(.7) translateY(60px);transition:all .8s cubic-bezier(.2,.8,.3,1)}
#reader.show{opacity:1;pointer-events:auto;transform:none}
#track{display:flex;width:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
#track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;display:flex;justify-content:center;padding:0 22px}
.paper{width:min(340px,100%);min-height:380px;background:var(--paper);border-radius:14px;padding:28px 24px 22px;text-align:center;box-shadow:0 14px 30px var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.paper h2{margin:6px 0 0;font-size:1.5rem;line-height:1.6;color:#5a8fc0}
.paper p{margin:0;line-height:1.8;font-size:1.02rem}
.dots{display:flex;gap:8px;margin-top:18px}
.dots span{width:9px;height:9px;border-radius:50%;background:var(--blue2);opacity:.4;transition:.3s}
.dots span.on{opacity:1;transform:scale(1.3)}
.sw{font-size:.85rem;opacity:.8;margin-top:10px}
button{font-family:inherit;border:0;background:var(--blue);color:var(--ink);padding:8px 18px;border-radius:20px;font-size:.9rem;margin-top:12px}
